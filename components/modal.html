<!-- Native dialog component reference. Pair with JavaScript openModal()/close(). -->
<dialog id="example-modal" aria-labelledby="example-modal-title" aria-describedby="example-modal-description">
  <div class="modal-content">
    <h2 id="example-modal-title">Dialog title</h2>
    <p id="example-modal-description">Describe the purpose of this dialog and what the user should do next.</p>
    <button class="button button-primary" type="button" onclick="this.closest('dialog').close()">Close dialog</button>
  </div>
</dialog>
